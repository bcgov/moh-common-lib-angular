<div
  class="modal"
  [class.show]="isOpen"
  [style.display]="isOpen ? 'block' : 'none'"
  [attr.aria-modal]="isOpen ? 'true' : null"
  role="dialog"
  [attr.aria-labelledby]="'samplesModalTitle_' + objectId"
  [attr.aria-hidden]="isOpen ? null : 'true'">
  <div class="modal-dialog modal-lg" role="document">
    <div class="modal-content">
      <div class="modal-header modal-header-primary">
        <h2
          class="modal-title pull-left"
          [id]="'samplesModalTitle_' + objectId">
          {{ title }}
        </h2>
        <button
          type="button"
          class="pull-right btn btn-link"
          (click)="closeModal()"
          aria-label="Close">
          <i class="text-danger fa fa-2x fa-times" aria-hidden="true"></i>
        </button>
      </div>

      <div class="modal-body">
        <div *ngFor="let image of images" class="fpcare-sample--row">
          <label for="image_{{ objectId }}" *ngIf="image?.title">
            {{ image.title }}
          </label>
          <img
            class="fpcare-sample--image"
            id="image_{{ objectId }}"
            src="{{ image.path }}"
            alt="{{ image.desc }}" />
        </div>
      </div>

      <div class="modal-footer">
        <button
          class="btn btn-block btn-primary pull-left"
          type="submit"
          (click)="closeModal()">
          Close
        </button>
      </div>
    </div>
  </div>
</div>
