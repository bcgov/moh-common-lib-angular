<div class="form-group col-sm-6 p-sm-0">
  <common-name
    label="First Name"
    [disabled]="disabled"
    [value]="person.firstName"
    (valueChange)="setName('firstName', $event)"
    (blur)="onBlur()"
    objectID="first_name"></common-name>
</div>

<div class="form-group col-sm-6 p-sm-0">
  <common-name
    label="Middle Name"
    [disabled]="disabled"
    [value]="person.middleName"
    (valueChange)="setName('middleName', $event)"
    (blur)="onBlur()"
    objectID="middle_name"></common-name>
</div>

<div class="form-group col-sm-6 p-sm-0">
  <common-name
    label="Last Name"
    [required]="required"
    [disabled]="disabled"
    [value]="person.lastName"
    (valueChange)="setName('lastName', $event)"
    (blur)="onBlur()"
    objectID="last_name"></common-name>
</div>
