name: PR validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CI: 'true'
  HUSKY: '0'
  NPM_CONFIG_REGISTRY: https://registry.npmjs.org

jobs:
  validate:
    name: Install, test, lint, pack
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
      - name: Select OIDC-compatible npm
        run: npm install --global npm@11.5.1 --ignore-scripts --registry=https://registry.npmjs.org
      - run: npm ci
      - run: npm test -- --ci --watch=false --run-in-band
      - run: npm run lint
      - run: npm run build-storybook
      - run: npm run pack:lib